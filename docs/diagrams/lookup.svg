<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 860 430' width='860' height='430' role='img' aria-label='One lookup'>
<title>One lookup</title>
<rect width='860' height='430' fill='#FFFFFF'/>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#3D4650'/></marker></defs>
<text x='430' y='32' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='20' fill='#14181D' font-weight='bold' text-anchor='middle'>One lookup: get(k) / get_or_insert_with(k, f)</text>
<rect x='330' y='60' width='200' height='46' rx='8' fill='#FFFFFF' stroke='#14181D' stroke-width='2'/>
<text x='430.0' y='88.0' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' fill='#14181D' font-weight='bold' text-anchor='middle'>hash k once</text>
<line x1='430' y1='106' x2='430' y2='136' stroke='#3D4650' stroke-width='2' marker-end='url(#a)'/>
<rect x='310' y='138' width='240' height='56' rx='8' fill='#E3F2EB' stroke='#0F7A55' stroke-width='2'/>
<text x='430.0' y='171.0' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' fill='#14181D' font-weight='bold' text-anchor='middle'>in current generation?</text>
<line x1='550' y1='166' x2='640' y2='166' stroke='#3D4650' stroke-width='2' marker-end='url(#a)'/>
<text x='575' y='158' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#3D4650' font-weight='normal' text-anchor='start' font-style='italic'>yes</text>
<rect x='642' y='140' width='190' height='52' rx='8' fill='#E3F2EB' stroke='#0F7A55' stroke-width='2'/>
<text x='737.0' y='163.0' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' fill='#14181D' font-weight='bold' text-anchor='middle'>hit</text>
<text x='737.0' y='181.0' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#3D4650' font-weight='normal' text-anchor='middle'>stats: hits += 1</text>
<line x1='430' y1='194' x2='430' y2='230' stroke='#3D4650' stroke-width='2' marker-end='url(#a)'/>
<text x='438' y='216' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#3D4650' font-weight='normal' text-anchor='start' font-style='italic'>no</text>
<rect x='310' y='232' width='240' height='56' rx='8' fill='#E4EEF9' stroke='#2E6FB7' stroke-width='2'/>
<text x='430.0' y='265.0' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' fill='#14181D' font-weight='bold' text-anchor='middle'>in previous generation?</text>
<line x1='550' y1='260' x2='640' y2='260' stroke='#3D4650' stroke-width='2' marker-end='url(#a)'/>
<text x='575' y='252' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#3D4650' font-weight='normal' text-anchor='start' font-style='italic'>yes</text>
<rect x='642' y='230' width='190' height='62' rx='8' fill='#E4EEF9' stroke='#2E6FB7' stroke-width='2'/>
<text x='737.0' y='258.0' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' fill='#14181D' font-weight='bold' text-anchor='middle'>promotion</text>
<text x='737.0' y='276.0' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#3D4650' font-weight='normal' text-anchor='middle'>move it back (may flip)</text>
<text x='737' y='312' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#3D4650' font-weight='normal' text-anchor='middle'>stats: promotions += 1</text>
<line x1='430' y1='288' x2='430' y2='326' stroke='#3D4650' stroke-width='2' marker-end='url(#a)'/>
<text x='438' y='310' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#3D4650' font-weight='normal' text-anchor='start' font-style='italic'>no</text>
<rect x='330' y='328' width='200' height='62' rx='8' fill='#FBEFF3' stroke='#8C2449' stroke-width='2'/>
<text x='430.0' y='356.0' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' fill='#14181D' font-weight='bold' text-anchor='middle'>miss</text>
<text x='430.0' y='374.0' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#3D4650' font-weight='normal' text-anchor='middle'>None, or insert f()</text>
<text x='430' y='410' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#3D4650' font-weight='normal' text-anchor='middle'>stats: misses += 1 (and inserts += 1 if f() was inserted; may flip)</text>
<text x='298' y='170' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6B7683' font-weight='normal' text-anchor='end' font-style='italic'>1st probe</text>
<text x='298' y='264' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6B7683' font-weight='normal' text-anchor='end' font-style='italic'>2nd probe</text>
