[package]
name = "fliplru-bench"
version = "0.0.0"
edition = "2021"
publish = false
description = "fliplru against other LRU caches: speed and hit ratio (stable Rust: cargo run --release)"

[dependencies]
fliplru = { path = ".." }
fliplru_016 = { package = "fliplru", version = "=0.1.6" }
lru = "0.18"
hashlink = "0.12"
schnellru = "0.2"
quick_cache = "0.7"
rustc-hash = "2"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
